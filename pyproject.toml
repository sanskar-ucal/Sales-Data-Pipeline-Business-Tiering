[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-pipeline"
version = "0.1.0"
description = "Sales ELT pipeline (Airflow + dbt + Great Expectations) with business tiering models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "great_expectations>=1.3,<2",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python[pandas]>=3.6", "snowflake-sqlalchemy>=1.5"]
tableau = ["pantab>=4.0", "tableauserverclient>=0.30"]
dbt = ["dbt-postgres>=1.8,<2"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
sales-pipeline = "sales_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
